<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2DRPG</title>
    <style>
      @font-face {
        font-family: "SparkyStones";
        src: url("./assets/fonts/SparkyStonesRegular-BW6ld.ttf")
          format("truetype");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0f;
        margin: 0;
        overflow: hidden;
      }

      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        margin: 0 auto;
        display: block;
      }

      #hud {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 8px 12px;
        font-family: "SparkyStones", monospace;
        font-size: 14px;
        color: #88ccff;
        background: rgba(10, 10, 26, 0.85);
        border: 1px solid #334455;
        border-radius: 4px;
        pointer-events: none;
        z-index: 10;
        display: none;
      }

      #dialog-box {
        width: 240px;
        min-height: 60px;
        padding: 6px 8px;
        background: rgba(10, 10, 26, 0.95);
        border: 1px solid #6688aa;
        border-radius: 4px;
        font-family: "SparkyStones", monospace;
        pointer-events: none;
      }

      #dialog-speaker {
        color: #88ccff;
        font-size: 16px;
        margin-bottom: 2px;
      }

      #dialog-text {
        color: #ccddcc;
        font-size: 14px;
        line-height: 1.2;
        white-space: normal;
        word-wrap: break-word;
      }

      #dialog-prompt {
        margin-top: 4px;
        color: #667788;
        font-size: 10px;
        text-align: right;
      }

      #map-panel {
        font-family: "SparkyStones", monospace;
        pointer-events: none;
      }

      #map-panel .map-title {
        color: #88ccff;
        font-size: 16px;
        margin-bottom: 2px;
      }

      #map-panel .map-frame {
        border: 1px solid #6688aa;
        border-radius: 2px;
        line-height: 0;
      }

      #map-panel .map-legend {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 2px;
      }

      #map-panel .map-legend .legend-section {
        color: #88ccff;
        font-size: 10px;
        margin-bottom: 1px;
      }

      #map-panel .map-legend .legend-item {
        color: #ccddcc;
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 3px;
        line-height: 1.1;
      }

      #map-panel .map-legend .legend-swatch {
        display: inline-block;
        width: 6px;
        height: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
      }

      #map-panel .map-hint {
        color: #667788;
        font-size: 10px;
        margin-top: 2px;
      }

      #title-screen {
        font-family: "SparkyStones", monospace;
        text-align: center;
        pointer-events: none;
      }

      #title-screen .title-frame {
        border: 1px solid rgba(136, 204, 255, 0.25);
        padding: 16px 28px;
        position: relative;
      }

      #title-screen .title-frame::before,
      #title-screen .title-frame::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        border: 1px solid rgba(136, 204, 255, 0.4);
      }

      #title-screen .title-frame::before {
        top: -1px;
        left: -1px;
        border-right: none;
        border-bottom: none;
      }

      #title-screen .title-frame::after {
        bottom: -1px;
        right: -1px;
        border-left: none;
        border-top: none;
      }

      #title-screen .corner-br,
      #title-screen .corner-tr {
        position: absolute;
        width: 8px;
        height: 8px;
        border: 1px solid rgba(136, 204, 255, 0.4);
      }

      #title-screen .corner-tr {
        top: -1px;
        right: -1px;
        border-left: none;
        border-bottom: none;
      }

      #title-screen .corner-br {
        bottom: -1px;
        left: -1px;
        border-right: none;
        border-top: none;
      }

      #title-screen #title {
        font-size: 60px;
        color: #c8e6a0;
        text-shadow: 2px 2px 0 #0a0a0f;
        margin-bottom: 4px;
      }

      #title-screen #subtitle {
        font-size: 16px;
        color: #6a8a5a;
        margin-bottom: 16px;
      }

      #title-screen #prompt {
        font-size: 14px;
        color: #88aa77;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="hud"></div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
